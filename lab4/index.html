<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анімації</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="animation-container">
        <!-- Дерево -->
        <div class="tree" style="top: 10%; left: 15%;"></div>
        <div class="tree" style="top: 5%; left: 70%;"></div>

        <!-- Персонаж (Артас) -->
        <div class="character">
            <img src="pukimon.png" alt="pukimon">
        </div>

        <!-- Земля -->
        <div class="ground">
            <div class="rocks" style="left: 10%;"></div>
            <div class="rocks" style="left: 40%;"></div>
            <div class="rocks" style="left: 70%;"></div>
        </div>
    </div>
</body>

</html>
