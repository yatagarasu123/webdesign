<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok UI Clone</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="time">9:41</div>
        <div class="status-icons">
            <div class="signal"></div>
            <div class="wifi"></div>
            <div class="battery"></div>
        </div>
    </nav>

    <!-- Tab Navigation -->
    <div class="tab-nav">
        <button class="tab-btn">Following</button>
        <button class="tab-btn active">For You</button>
    </div>

    <!-- Main Content Area -->
    <main class="content">
        <div class="background-image"></div>
        <!-- Video Container -->
        <div class="video-container">
            <div class="video-wrapper">
                <!-- Video placeholder -->
                <div class="video-placeholder"></div>
            </div>

            <!-- Right Sidebar Actions -->
            <div class="action-bar">
                <img src="right.png" alt="Right widgets" class="right-widgets">
            </div>

            <!-- Video Info -->
            <div class="video-info">
                <img src="bottom.png" alt="Bottom widgets" class="bottom-widgets">
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-btn active">
            <div class="icon home"></div>
            <span>Home</span>
        </button>
        <button class="nav-btn">
            <div class="icon discover"></div>
            <span>Discover</span>
        </button>
        <button class="nav-btn">
            <div class="icon plus"></div>
        </button>
        <button class="nav-btn">
            <div class="icon inbox"></div>
            <span>Inbox</span>
        </button>
        <button class="nav-btn">
            <div class="icon profile"></div>
            <span>Profile</span>
        </button>
    </nav>
</body>
</html>
