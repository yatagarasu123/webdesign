<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новорічний лист</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body class="page">
    <div class="snowflakes">
        <div class="snowflakes__flake"></div>
        <div class="snowflakes__flake"></div>
        <div class="snowflakes__flake"></div>
        <div class="snowflakes__flake"></div>
        <div class="snowflakes__flake"></div>
        <div class="snowflakes__flake"></div>
        <div class="snowflakes__flake"></div>
        <div class="snowflakes__flake"></div>
        <div class="snowflakes__flake"></div>
        <div class="snowflakes__flake"></div>
    </div>
    <div class="card">
        <div class="garland garland--top"></div>
        <div class="garland garland--right"></div>
        <div class="garland garland--bottom"></div>
        <div class="garland garland--left"></div>
        <header class="card__header">
            <h1 class="card__title">З Новим 2025 роком!</h1>
        </header>
        <main class="card__content">
            <div class="greeting">
                <p class="greeting__text">Бажаю вам і надалі залишатися такою ж терплячою і розуміючою людиною, якою ви були для своїх студентів у цьому семестрі!</p>
            </div>
            <div class="decoration">
                <div class="decoration__tree"></div>
                <div class="decoration__gifts">
                    <div class="decoration__gift decoration__gift--small"></div>
                    <div class="decoration__gift decoration__gift--medium"></div>
                    <div class="decoration__gift decoration__gift--large"></div>
                </div>
            </div>
        </main>
        <footer class="card__footer">
            <p class="card__signature">З любов'ю, Гончарук Владислав</p>
        </footer>
    </div>
</body>
</html>
